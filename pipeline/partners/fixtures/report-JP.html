    function showresults(dis, ajaxload) {

        var currentSlug = window.location.pathname.split('/').filter(Boolean).pop();

        jQuery.post(ajaxurl, {
            action: 'check_old_ap_url',
            slug: currentSlug
        }, function(res) {

            if (res.redirect) {

                var currentUrl = window.location.origin + window.location.pathname.replace(/\/+$/, '');
                var redirectUrl = res.redirect.replace(/\/+$/, '');

                if (currentUrl !== redirectUrl) {

                    var form = jQuery('<form>', {
                        method: 'POST',
                        action: res.redirect
                    });

                    jQuery("#myModal_irm_report_filter :input")
                        .not(":button,:submit,:reset")
                        .each(function() {

                            if (jQuery(this).val() !== "") {
                                form.append(
                                    jQuery('<input>', {
                                        type: 'hidden',
                                        name: jQuery(this).attr('name'),
                                        value: jQuery(this).val()
                                    })
                                );
                            }

                        });

                    jQuery('body').append(form);
                    form.submit();

                    return;
                }
            }

            runSearchLogic(dis, ajaxload);

        });

    }

    // Function to get all the submitted form data
    // By: Sanat Kumar Panda <sanat.panda@nettantra.net>
    function getIndexedFormData($form) {
        var unindexed_array = $form.serializeArray();
        var indexed_array = {};
        jQuery.map(unindexed_array, function(n, i) {
            // Check if the values are not empty/blank and form the structured object
            if (n['value'] != "")
                indexed_array[n['name']] = n['value'];
        });

        if (jQuery('#relation_external_institution_ids').val() != null) {
            window.external_inst_val = jQuery('#relation_external_institution_ids').val();
        }
        if (jQuery("#country_id").val() == "") {
            window.external_inst_val = "";
        }

        if (typeof window.external_inst_val != "undefined" && window.external_inst_val != "") {
            indexed_array['relation_external_institution_ids'] = window.external_inst_val;
        }

        return indexed_array;
    }

    var use_stadiamap = "1"; // To check if the map is to be used is Stadia maps or not
    var map_language = "en"; // Get the set language for the Map in the instance

    const stadia_key = ""; // Get the map key for Stadia Maps

    const MAP_CONFIG = {
        defaultZoom: 5,
        maxZoom: 18,
        defaultLat: -37.82,
        defaultLong: 175.24
    };

    const LOCALE_TO_MAP_LANG = {
        'de_DE': 'de',
        'es_ES': 'es',
        'en_US': 'en',
        'fr_FR': 'fr'
    };

    //Get the instance language
    var map_local = "";
    // Get the local language of map according to instance language
    mapLang = LOCALE_TO_MAP_LANG[map_local] || 'en';

    // override the above language with the map language - The case where map language is set different from the locale language
    if (map_language && map_language !== '') {
        mapLang = map_language;
    }

    var stadia_map_url = 'https://tiles-eu.stadiamaps.com/styles/osm_bright.json';
    if (stadia_key && stadia_key !== '') {
        stadia_map_url = 'https://tiles-eu.stadiamaps.com/styles/osm_bright.json?api_key=' + stadia_key;
    }

    if (use_stadiamap && use_stadiamap == '1') {
        // Use Vector tiles, as JSON, from Stadia Maps
        var map = L.map('map', {
            center: [MAP_CONFIG.defaultLat, MAP_CONFIG.defaultLong],
            zoom: MAP_CONFIG.defaultZoom,
            maxZoom: MAP_CONFIG.maxZoom
        });
        maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js');

        var mapLibre = L.maplibreGL({
            style: stadia_map_url,
            attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank" aria-label="Stadia Maps (opens in a new tab)">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/" target="_blank" aria-label="OpenMapTiles (opens in a new tab)">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" aria-label="OpenStreetMap (opens in a new tab)">OpenStreetMap</a>',
        }).addTo(map);

        // Access the underlying MapLibre GL map instance
        var maplibreMap = mapLibre.getMaplibreMap();
        maplibreMap.on('load', function() {
            // Modify the layers directly
            maplibreMap.getStyle().layers.forEach(function(layer) {
                if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
                    maplibreMap.setLayoutProperty(layer.id, 'text-field', [
                        'coalesce',
                        ['get', 'name:' + mapLang], // Set Language first
                        ['get', 'name:en'], // Fallback to English
                        ['get', 'name:latin'], // Then try Latin script
                        ['get', 'name'], // Finally fall back to default name
                        '' // Empty string as final fallback if nothing exists
                    ]);
                    maplibreMap.setLayoutProperty(layer.id, 'text-size', 10);
                }
            });

            var canvas = maplibreMap.getCanvas();
            if (canvas) {
                canvas.setAttribute('aria-hidden', 'true');
            }

            var canvasContainer = maplibreMap.getCanvasContainer();
            if (canvasContainer) {
                canvasContainer.setAttribute('aria-hidden', 'true');
            }
        });
    } else {
        // Use default map with Rastertiles from Basemaps
        var tile_url = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png';

        var tiles = L.tileLayer(tile_url, {
                maxZoom: MAP_CONFIG.maxZoom,
                attribution: '&copy; <a target="_blank" href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Points &copy 2012 LINZ'
            }),
            latlng = L.latLng(MAP_CONFIG.defaultLat, MAP_CONFIG.defaultLong);

        var map = L.map('map', {
            center: latlng,
            zoom: MAP_CONFIG.defaultZoom,
            layers: [tiles]
        });
    }

    var newaddressPoints = [];

    // retrieving all data points markers on map
    function getAllmarkersOnMap() {
        map.removeLayer(markers);
        markers = L.markerClusterGroup();
        newaddressPoints = [];
        mapbounds = [];
        //format of lat and lang [-37.8210922667, 175.2209316333, "2"]
        jQuery.each(moreinformatics, function(index, value) {
            var tempArray = [];
            if (value['longitude'] != '' && value['latitude'] != '' && value['longitude'] != null && value['latitude'] != '' && value['flagname'] != '' && value['latitude'] != 0.0 && value['longitude'] != 0.0 && Math.abs(parseFloat(value['latitude'])) <= 90 && Math.abs(parseFloat(value['longitude'])) <= 180) {

                tempArray.push(parseFloat(value['latitude']));
                tempArray.push(parseFloat(value['longitude']));
                tempArray.push(value['flagname']);
                newaddressPoints.push(tempArray);

            }
        });

        jQuery.each(moreinformatics, function(index, value) {
            var tempArray = [];
            if (value['longitude'] != '' && value['latitude'] != '' && value['longitude'] != null && value['latitude'] != '' && value['flagname'] != '' && value['latitude'] != 0.0 && value['longitude'] != 0.0 && Math.abs(parseFloat(value['latitude'])) <= 90 && Math.abs(parseFloat(value['longitude'])) <= 180) {

                tempArray.push(parseFloat(value['latitude']));
                tempArray.push(parseFloat(value['longitude']));

                if (value['latitude'] < 180) {
                    mapbounds.push(tempArray);
                }
            }
        });


        for (var i = 0; i < newaddressPoints.length; i++) {
            var a = newaddressPoints[i];
            var title = a[2];
            var marker = L.marker(new L.LatLng(a[0], a[1]), {
                title: title
            });
            marker.bindPopup(title);
            markers.addLayer(marker);
        }

        map.addLayer(markers);
        if (mapbounds.length > 0) {
            map.fitBounds(mapbounds);
        }
    }

                        // Case of screen resize - when the data fits in a particular resolution,

                        }
                    }

            return '<div class="university_stats_html_content">' + value + '</div>';
        }

    }

    function removePdf(cleanup_token) {
        // AJAX Call to delete the pdf file - after it is downloaded.
        jQuery.ajax({
            url: ajaxurl,
            type: 'POST',
            data: {
                'action': 'pdf_moredetails_clear',
                'cleanup_token': cleanup_token
            },
            success: function(response) {
                console.log(response.message);
            }
        });
    }


    //PDF Download functionality
    jQuery(document).ready(function($) {
        $('#pdf-download').on('click', function(e) {
            e.preventDefault();
            let reportMoreDetails = JSON.parse(window.localStorage.getItem('reportMoreDetails'));
            jQuery.ajax({
                url: ajaxurl,
                type: 'POST',
                data: {
                    'action': 'load_report_data_on_ajax_load',
                    'action_type': 'download',
                    'searched_data': {
                        core_id: reportMoreDetails.r_core_id,
                        relation_id: reportMoreDetails.r_relation_id,
                        publisher_id: reportMoreDetails.r_publisher_id
                    }
                },
                success: function(response) {
                    console.log(response);
                    var blob = new Blob([response], {
                        type: 'application/pdf'
                    });
                    var link = document.createElement('a');
                    link.href = response.pdf_path;
                    link.download = "moredetails.pdf";
                    link.click();
                    // Delete the file after 5 Seconds
                    setTimeout(function() {
                        removePdf(response.cleanup_token);
                    }, 5000);
                }
            });
        });
    });

    jQuery(document).ready(function($) {
        // Use event delegation to handle click events for dynamically generated .modified-pdf-link
        $(document).on('click', '.modified-pdf-link', function(e) {
            e.preventDefault();
            var fileId = $(this).attr('data-id');
            // AJAX request using WordPress AJAX URL to fetch the PDF data
            $.ajax({
                url: ajaxurl, // Use the WordPress AJAX URL
                method: 'POST',
                xhrFields: {
                    responseType: 'blob' // important part handling binary PDF data
                },
                data: {
                    action: 'fetch_pdf_data', // WordPress AJAX action name
                    fileId: fileId,
                    publisherId: 10                },
                success: function(response) {
                    //console.log(response); // Log the response to debug
                    var blob = new Blob([response], {
                        type: 'application/pdf'
                    });
                    var url = URL.createObjectURL(blob);
                    var newTab = window.open();
                    newTab.location = url;
                },
                error: function(xhr, status, error) {
                    console.error('Error fetching PDF data:', error);
                    var msg = xhr.getResponseHeader('X-AP-Error-Message');
                    if (msg) alert(msg);
                }
            });
        });
    });
